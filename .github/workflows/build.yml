name: Build and Push

on:
  # BUILD: Mỗi khi push code lên main
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/build.yml'

  # Manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        type: string
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: smarteventmanagementsystem

jobs:
  build:
    name: 'Build & Push web-client'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag
        id: vars
        run: |
          # Use tag if provided, otherwise use short sha
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create Dockerfile if not exists
      - name: Prepare Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile << 'EOF'
            # Build stage
            FROM node:20-alpine AS builder
            WORKDIR /app

            # Copy package files
            COPY package*.json ./

            # Install dependencies
            RUN npm ci

            # Copy source code
            COPY . .

            # Build
            RUN npm run build

            # Production stage
            FROM nginx:alpine

            # Copy nginx config
            COPY nginx.conf /etc/nginx/conf.d/default.conf

            # Copy built files
            COPY --from=builder /app/dist /usr/share/nginx/html

            # Expose port
            EXPOSE 80

            # Health check
            HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
              CMD wget -qO- http://localhost/health || exit 1

            # Start nginx
            CMD ["nginx", "-g", "daemon off;"]
            EOF
          fi

          # Create nginx.conf if not exists
          if [ ! -f nginx.conf ]; then
            cat > nginx.conf << 'EOF'
            server {
                listen 80;
                server_name localhost;
                root /usr/share/nginx/html;
                index index.html;

                # Health check endpoint
                location /health {
                    return 200 'healthy';
                    add_header Content-Type text/plain;
                }

                # SPA routing
                location / {
                    try_files $uri $uri/ /index.html;
                }

                # API proxy (optional)
                location /api {
                    proxy_pass http://event-service:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                # Cache static assets
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
            }
            EOF
          fi

      # Build and push
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Discord Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI="🔨"
          [ "$STATUS" == "success" ] && EMOJI="✅" || EMOJI="❌"
          curl -X POST "${{ vars.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/fake' }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$EMOJI web-client:${{ steps.vars.outputs.tag }} $STATUS\nCommit: \`${{ github.sha }}\`\"}"
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:${{ steps.vars.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
